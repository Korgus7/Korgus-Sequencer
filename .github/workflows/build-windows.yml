name: Windows build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'Nova/**', '.github/workflows/build-nova.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASIO SDK
        shell: bash
        run: |
          set -e
          mkdir -p ext
          if curl -fsSL -o ext/asiosdk.zip "https://www.steinberg.net/asiosdk"; then
            (cd ext && unzip -q asiosdk.zip)
          else
            git clone --depth 1 https://github.com/jcelerier/asio-2 ext/asio-2
          fi
          HDR=$(find ext -name iasiodrv.h | head -1)
          test -n "$HDR"
          SDK=$(cd "$(dirname "$HDR")/.." && pwd -W)
          echo "ASIO SDK: $SDK"
          echo "ASIO_SDK_DIR=$SDK" >> "$GITHUB_ENV"

      - name: WebView2 SDK
        shell: bash
        run: |
          set -e
          mkdir -p ext/webview2/Microsoft.Web.WebView2.1.0.1901.177
          curl -fsSL -o ext/wv2.zip "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.1901.177"
          (cd ext/webview2/Microsoft.Web.WebView2.1.0.1901.177 && unzip -q ../../wv2.zip)
          echo "WV2_DIR=$(cd ext/webview2 && pwd -W)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -A x64 -DKORGUS_BUILD=${{ github.run_number }} -DASIO_SDK_DIR="${{ env.ASIO_SDK_DIR }}" -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ env.WV2_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp "build/KorgusSequencer_artefacts/Release/Korgus Sequencer.exe" out/
          # ONNX Runtime pre oddelenie spevu (dava sa vedla programu do priecinka AI)
          mkdir -p out/AI
          curl -sSL -o ort.zip https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-win-x64-1.20.1.zip
          unzip -q -j ort.zip "onnxruntime-win-x64-1.20.1/lib/onnxruntime.dll" -d out/AI
          # Korgus Inspire (posledny build z vetvy nova)
          if git fetch -q --depth 1 origin nova; then git show "FETCH_HEAD:Korgus Inspire.vst3" > "out/Korgus Inspire.vst3" || rm -f "out/Korgus Inspire.vst3"; fi
          echo "1.0.${{ github.run_number }}" > out/version.txt
          ls -la out out/AI

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVer=1.0.${{ github.run_number }}" "/DSrc=$PWD\out" installer\KorgusSequencer.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force out\Setup | Out-Null
          Move-Item setup\*.exe out\Setup\
          Get-ChildItem out\Setup

      - uses: actions/upload-artifact@v4
        with:
          name: KorgusSequencer-windows
          path: out/

      - name: Publish to build branch
        shell: bash
        run: |
          cd out
          git init -q
          git checkout -q -b build
          git add -A
          git -c user.name="ci" -c user.email="ci@localhost" commit -qm "build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
