name: Windows build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: ASIO SDK
        shell: bash
        run: |
          set -e
          mkdir -p ext
          if curl -fsSL -o ext/asiosdk.zip "https://www.steinberg.net/asiosdk"; then
            (cd ext && unzip -q asiosdk.zip)
          else
            git clone --depth 1 https://github.com/jcelerier/asio-2 ext/asio-2
          fi
          HDR=$(find ext -name iasiodrv.h | head -1)
          test -n "$HDR"
          SDK=$(cd "$(dirname "$HDR")/.." && pwd -W)
          echo "ASIO SDK: $SDK"
          echo "ASIO_SDK_DIR=$SDK" >> "$GITHUB_ENV"

      - name: WebView2 SDK
        shell: bash
        run: |
          set -e
          mkdir -p ext/webview2/Microsoft.Web.WebView2.1.0.1901.177
          curl -fsSL -o ext/wv2.zip "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.1901.177"
          (cd ext/webview2/Microsoft.Web.WebView2.1.0.1901.177 && unzip -q ../../wv2.zip)
          echo "WV2_DIR=$(cd ext/webview2 && pwd -W)" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake -S . -B build -A x64 -DASIO_SDK_DIR="${{ env.ASIO_SDK_DIR }}" -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ env.WV2_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp "build/KorgusSequencer_artefacts/Release/Korgus Sequencer.exe" out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: KorgusSequencer-windows
          path: out/

      - name: Publish to build branch
        shell: bash
        run: |
          cd out
          git init -q
          git checkout -q -b build
          git add -A
          git -c user.name="ci" -c user.email="ci@localhost" commit -qm "build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build
