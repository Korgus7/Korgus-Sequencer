name: AI model (melody)
on: workflow_dispatch
jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch && pip install transformers numpy
      - run: python tools/ai_convert.py
      - run: ls -la melody.kamt reference.json && sha256sum melody.kamt
      - uses: actions/upload-artifact@v4
        with:
          name: melody-model
          path: |
            melody.kamt
            reference.json
